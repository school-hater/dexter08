function lp(now){if(dn||FIN.dead)return;const dt=Math.min(.25,(now-last)/1000);last=now;
if(holding){t+=dt;K.forEach((k,i)=>{if(t>=k[0]&&!done.has(i)){done.add(i);if(k[1]==='k')A.knock(k[2]);else A.say(k[2],.2,.55,.8)}});
$('#hcnt').textContent=Math.floor(t/4)%8+1;$('#hbar i').style.width=Math.min(100,t/40*100)+'%';if(t>=40){clean();return ending(2)}}
else if(started){gr+=dt;if(gr>.7){clean();return ending(1,'eyes_fail')}}
requestAnimationFrame(lp)}requestAnimationFrame(lp)}
const ENDS={
1:v=>({title:'ENDING 1 \u2014 VIEWER COUNT: 1',sub:'You were killed',paras:[({door:'You open the door.',time:'You wait too long. The handle finishes turning by itself.',eyes_fail:'You open your eyes. You should not have. It was already in front of you.',marked_eyes:'You close your eyes and start to count. It says your name. Of course it does: you answered, you subscribed, you were counted. It was always going to know it. You open your eyes at "four".'}[v]||'You open the door.'),
'It is taller than the frame. It has been waiting longer than the house has existed, and it is so patient. It does not rush. It looks at you the way a viewer looks at a screen.',
'In the morning Mara finds your apartment empty. The camera is still recording. The closet door is open.','At 03:33 a new video goes up on dexter08: "hi '+esc(S.name)+'". Four minutes long. One view.']}),
2:()=>({title:'ENDING 2 \u2014 LIGHTS ON',sub:'You survived',paras:['Eight. Then eight again. The knocking becomes pounding becomes scratching becomes the sound of something very tired deciding to leave.','When you open your eyes it is morning. The hallway is empty. On the floor outside your door, eight tally marks are scratched into the wood. Seven crossed out. The eighth, now, is crossed out too. The ninth was never written.','Mara answers on the second ring. She sounds confused. She says she never emailed you last night. She is fine. You do not publish. You delete the case file and unplug the camera.','dexter08 says "This video isn\'t available" now. But sometimes, late, when your screen is dark, you check a view counter that should be zero. You never check it twice.']}),
3:v=>({title:'ENDING 3 \u2014 dexter09',sub:v==='marked'?'You had already said hello':'You took the channel',paras:['You press UPLOAD. The progress bar fills slowly, then all at once.','The knocking stops. It was never at the door. It was waiting for a name to wear. Yours replaces the eight: dexter09. Another tally mark appears in the closet, in your handwriting.',v==='marked'?'It is gentle about it. You replied, after all. You were so polite.':'You were so careful, so close, and still you pressed it.','Your camera light turns green. You smile because it is easier than not smiling. You document everything. You are very good at this.','Somewhere, someone is about to discover your channel and start to watch.'],
extra:`<div class="chan"><b>dexter09</b><br><small style="color:#999">0 subscribers \u00b7 1 viewer watching now</small><p style="margin:8px 0 0">New upload: "hi."</p><button class="btn" data-act="e3sub" style="margin-top:8px">Subscribe</button></div>`})};
function ending(n,v){if(FIN){FIN.dead=true;cancelAnimationFrame(FIN.raf);if(FIN.clean)FIN.clean()}A.box(false);try{speechSynthesis.cancel()}catch(e){}
$('#finale').hidden=true;const e=$('#ending');e.hidden=false;addEnding(n);const E=ENDS[n](v);
e.innerHTML=`<div class="ec"><div class="et">${E.title}</div><div class="es">${E.sub}</div>${E.paras.map((p,i)=>`<p style="animation-delay:${i*2.2+1}s">${p}</p>`).join('')}${E.extra||''}<div class="eb" style="animation-delay:${E.paras.length*2.2+2}s"><button data-act="totitle">Return to title</button><button data-act="retry">Return to the last moment</button></div></div>`;
if(n===1)A.sting();else if(n===2){A.tone(440,2,'sine',.06);A.tone(660,2.5,'sine',.05,.3)}else A.box(true)}

/* ---------- title ---------- */
function showTitle(){if(FIN){FIN.dead=true;cancelAnimationFrame(FIN.raf);if(FIN.clean)FIN.clean()}A.box(false);stopPlayer();const sv=loadSave(),en=endings();
['#browser','#finale','#ending'].forEach(s=>$(s).hidden=true);$('#title').hidden=false;
let last='';try{last=localStorage.getItem('dexter08_name')||''}catch(e){}
$('#tmenu').innerHTML=`${sv?`<button class="tbtn" id="bc">${sv.finale?'Continue \u2014 the final night':'Continue'} <small style="color:#887">(${esc(sv.name)} \u00b7 ${fmtH(sv.playSec/SPD)})</small></button>`:''}<input id="nm" maxlength="18" placeholder="Your name, reporter" value="${esc(last)}"><button class="tbtn" id="bn">New investigation</button>`;
$('#tend').innerHTML=`<span class="${en[1]?'on':''}" title="Ending 1">\u2620</span><span class="${en[2]?'on':''}" title="Ending 2">\u263d</span><span class="${en[3]?'on':''}" title="Ending 3">\u25b6</span>`;
if(sv)$('#bc').onclick=()=>{A.init();startGame(sv)};
$('#bn').onclick=()=>{if(sv&&!confirm('Erase your current save and start over?'))return;const n=($('#nm').value||'Reporter').trim().slice(0,18)||'Reporter';try{localStorage.setItem('dexter08_name',n)}catch(e){}A.init();startGame(fresh(n))}}
function startGame(s){S=s;S.f=S.f||{};$('#title').hidden=true;$('#ending').hidden=true;A.init();A.dread(S.dread);$('#mute').textContent=MUTE?'\ud83d\udd07':'\ud83d\udd0a';
if(S.finale){startFinale();startTick();return}
$('#browser').hidden=false;if(!S.ev.m1)fire('m1');if(S.done.v8&&!S.ev.m7)fire('m7');updateTray();render();renderSide();startTick()}
showTitle();
})();
</script>
